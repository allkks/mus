<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUS.LIB — Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { bg: '#0a0510', accent: '#8a2be2', surface: '#1a1225', text: '#ffffff', dim: '#b3a9c0', heart: '#ff2d55', brandY: '#ffcc00' } } }
        }
    </script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Manrope', sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .app-container { background-color: #0a0510; width: 100%; max-width: 480px; margin: 0 auto; height: 100vh; position: relative; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-player { background: rgba(26, 18, 37, 0.98); backdrop-filter: blur(30px); border-top: 1px solid rgba(138, 43, 226, 0.2); }
        .h-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding: 10px 0; }
        .album-card { min-width: 140px; max-width: 140px; scroll-snap-align: start; flex-shrink: 0; }
        .album-card img { width: 140px; height: 140px; border-radius: 1.5rem; object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); }
        .track-column { min-width: 85vw; max-width: 380px; scroll-snap-align: start; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
        .page { transition: opacity 0.3s ease; }
        .hero-bg { background: linear-gradient(180deg, transparent 0%, #0a0510 100%); }
    </style>
</head>
<body class="flex items-center justify-center sm:bg-zinc-950">
    <div class="app-container sm:border-x sm:border-white/10">
        <main id="scroll-container" class="absolute inset-0 overflow-y-auto no-scrollbar pb-40">
            <!-- Header -->
            <div class="p-6 pt-10 sticky top-0 bg-bg/90 backdrop-blur-xl z-50 flex items-center gap-4">
                <div class="flex-1 flex items-center gap-3 bg-surface/50 border border-white/5 rounded-2xl px-5 py-3 focus-within:border-accent">
                    <i data-lucide="search" class="w-4 h-4 text-dim"></i>
                    <input id="search-input" type="text" placeholder="Поиск музыки" class="bg-transparent outline-none w-full text-sm text-white" oninput="handleSearch()">
                </div>
                <div id="user-avatar" class="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center border border-accent/30 overflow-hidden text-accent shrink-0">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
            </div>

            <!-- Home -->
            <section id="page-home" class="page p-4">
                <div onclick="playRandom()" class="relative h-48 rounded-[2.5rem] overflow-hidden mb-10 bg-gradient-to-br from-accent to-heart p-8 flex flex-col justify-end cursor-pointer active:scale-95 transition-all shadow-xl">
                    <h2 class="text-3xl font-black italic tracking-tighter">Случайный трек</h2>
                    <div class="absolute bottom-6 right-6 w-10 h-10 bg-white rounded-full flex items-center justify-center text-black shadow-lg"><i data-lucide="play" class="fill-black ml-1"></i></div>
                </div>
                <div class="mb-10">
                    <h2 class="text-xl font-bold mb-4 px-2 flex items-center gap-2"><i data-lucide="trending-up" class="w-5 h-5 text-brandY"></i>Новинки</h2>
                    <div id="home-charts" class="h-scroll no-scrollbar px-2"></div>
                </div>
                <div id="fav-section" class="hidden mb-10">
                    <h2 onclick="openFullList('Мне нравится', getFavorites())" class="text-xl font-bold mb-4 px-2 flex items-center justify-between text-heart cursor-pointer">
                        <span>Мне нравится</span><i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </h2>
                    <div id="favorites-list" class="h-scroll no-scrollbar px-2"></div>
                </div>
                <div class="mb-10">
                    <h2 class="text-xl font-bold mb-4 px-2">Исполнители</h2>
                    <div id="home-artists" class="h-scroll no-scrollbar px-2"></div>
                </div>
            </section>

            <!-- Artist Page -->
            <section id="page-artist" class="page hidden">
                <div class="relative h-[45vh] w-full flex flex-col justify-end overflow-hidden">
                    <img id="artist-view-img" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 hero-bg"></div>
                    <button onclick="navTo('home')" class="absolute top-10 left-6 bg-black/40 p-3 rounded-full text-white z-10 backdrop-blur-md"><i data-lucide="chevron-left"></i></button>
                    <div class="relative p-6 pb-8 z-10">
                        <h1 id="artist-view-name" class="text-4xl font-black mb-4 drop-shadow-lg"></h1>
                        <button class="bg-brandY text-black px-12 py-3 rounded-full font-black shadow-xl" id="btn-play-artist">СЛУШАТЬ</button>
                    </div>
                </div>
                <div class="p-4">
                    <h2 class="text-xl font-bold mb-4 text-white">Треки</h2>
                    <div id="artist-view-tracks" class="space-y-1"></div>
                    <h2 class="text-xl font-bold mb-4 mt-8 text-white">Альбомы</h2>
                    <div id="artist-view-albums" class="h-scroll no-scrollbar"></div>
                </div>
            </section>

            <!-- Album Page -->
            <section id="page-album" class="page hidden">
                <div class="relative h-[35vh] w-full flex flex-col justify-end text-center overflow-hidden">
                    <img id="album-view-img" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 hero-bg"></div>
                    <button id="btn-album-back" class="absolute top-10 left-6 bg-black/40 p-3 rounded-full text-white z-10 backdrop-blur-md"><i data-lucide="chevron-left"></i></button>
                    <div class="relative p-6 pb-6 z-10">
                        <h1 id="album-view-title" class="text-2xl font-black mb-1 drop-shadow-md"></h1>
                        <p id="album-view-artist" class="text-dim mb-4 uppercase tracking-widest text-xs"></p>
                        <button class="bg-white text-black px-10 py-3 rounded-full font-bold shadow-xl" id="btn-play-album">СЛУШАТЬ ВСЁ</button>
                    </div>
                </div>
                <div class="p-4 space-y-1" id="album-tracks-list"></div>
            </section>

            <section id="page-search" class="page hidden p-6"><div id="search-results" class="space-y-2"></div></section>
            <section id="page-full-list" class="page hidden p-6"><div id="full-list-content"></div></section>
        </main>

        <!-- Mini Player -->
        <div id="mini-player" onclick="openFullPlayer()" class="glass-player absolute bottom-24 left-2 right-2 rounded-3xl p-3 z-[100] transition-all duration-500 translate-y-[200px] flex items-center gap-3 shadow-2xl">
            <img id="m-img" class="w-12 h-12 rounded-xl object-cover shrink-0 bg-surface">
            <div class="flex-1 min-w-0">
                <div id="m-title" class="font-bold text-sm truncate">...</div>
                <div id="m-artist" class="text-dim text-[10px] uppercase truncate">...</div>
            </div>
            <button onclick="event.stopPropagation(); togglePlay()" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center shrink-0 shadow-lg">
                <i id="m-play-icon" data-lucide="play" class="fill-black w-5 h-5 ml-0.5"></i>
            </button>
        </div>

        <!-- Full Player -->
        <div id="full-player" class="absolute inset-0 bg-bg z-[200] transition-transform duration-500 translate-y-full flex flex-col p-8 pb-12">
            <div class="flex justify-between items-center mb-4 text-white">
                <button onclick="closeFullPlayer()"><i data-lucide="chevron-down" class="w-8 h-8"></i></button>
                <span class="text-[10px] font-bold uppercase tracking-widest opacity-30">Плеер</span>
                <i data-lucide="more-horizontal" class="opacity-30"></i>
            </div>
            <div class="flex-1 flex items-center justify-center mb-8">
                <img id="f-img" class="w-full aspect-square max-w-[300px] rounded-[3rem] object-cover shadow-2xl border border-white/5 bg-surface">
            </div>
            <div class="flex items-center justify-between mb-6">
                <div class="flex-1 min-w-0 pr-4 text-white">
                    <h2 id="f-title" class="text-3xl font-black truncate leading-tight">...</h2>
                    <p id="f-artist" class="text-lg text-dim truncate">...</p>
                </div>
                <button onclick="toggleFavorite(currentTrackId)" id="f-heart" class="text-white"><i data-lucide="heart" class="w-8 h-8"></i></button>
            </div>
            <div class="mb-8">
                <div class="relative h-1.5 bg-white/10 rounded-full mb-3 cursor-pointer" id="seek-bar" onclick="seek(event)">
                    <div id="f-progress" class="absolute top-0 left-0 h-full bg-white rounded-full"></div>
                </div>
                <div class="flex justify-between text-[11px] font-mono text-dim">
                    <span id="f-current-time">0:00</span>
                    <span id="f-total-time">0:00</span>
                </div>
            </div>
            <div class="flex items-center justify-around mb-4">
                <button onclick="toggleShuffle()" id="shuffle-btn" class="opacity-20 text-white"><i data-lucide="shuffle" class="w-6 h-6"></i></button>
                <button onclick="prevTrack()" class="text-white"><i data-lucide="skip-back" class="w-10 h-10 fill-white"></i></button>
                <button onclick="togglePlay()" class="w-20 h-20 bg-white text-black rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition-all">
                    <i id="f-play-icon" data-lucide="play" class="fill-black w-10 h-10 ml-1"></i>
                </button>
                <button onclick="nextTrack()" class="text-white"><i data-lucide="skip-forward" class="w-10 h-10 fill-white"></i></button>
                <button onclick="toggleRepeat()" id="repeat-btn" class="opacity-20 text-white"><i data-lucide="repeat" class="w-6 h-6"></i></button>
            </div>
        </div>

        <!-- Navbar -->
        <div class="absolute bottom-0 left-0 right-0 h-20 bg-bg/80 backdrop-blur-md border-t border-white/5 flex items-center justify-around z-[90] pb-safe">
            <button onclick="navTo('home')" id="nav-home" class="flex flex-col items-center gap-1 text-brandY">
                <i data-lucide="home"></i><span class="text-[9px] font-bold">ГЛАВНАЯ</span>
            </button>
            <button onclick="openFullList('Мне нравится', getFavorites())" id="nav-fav" class="flex flex-col items-center gap-1 text-dim/40">
                <i data-lucide="heart"></i><span class="text-[9px] font-bold">МОЁ</span>
            </button>
        </div>
        <audio id="audio-engine"></audio>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDRxdwpKhy4hn-umuwKLrYfCZ4caafAV_o", 
            authDomain: "project-48022103835443054.firebaseapp.com", 
            databaseURL: "https://project-48022103835443054-default-rtdb.firebaseio.com", 
            projectId: "project-48022103835443054", 
            storageBucket: "project-48022103835443054.firebasestorage.app", 
            messagingSenderId: "812358314577", 
            appId: "1:812358314577:web:a392af88486face13aa670" 
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const tg = window.Telegram.WebApp; tg.ready();
        const user = tg.initDataUnsafe?.user || { id: "guest", first_name: "Слушатель" };
        
        let db = { tracks: [], artists: {} }, favorites = [], currentTrackId = null, currentPlaylist = [], isShuffle = false, isRepeat = false;
        const audio = document.getElementById('audio-engine');

        function sanitize(n) { return n ? n.toString().replace(/[.$#\[\]\/]/g, "").trim() : ""; }
        function imgBust(u) { return u ? `${u}?v=2` : 'https://via.placeholder.com/300'; }
        function formatTime(s) { if(!s || isNaN(s)) return "0:00"; const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }

        window.onload = () => {
            rtdb.ref('/').on('value', (snap) => {
                const data = snap.val() || {};
                const source = data.music_data || data;
                db.tracks = Array.isArray(source.tracks) ? source.tracks : Object.values(source.tracks || {});
                db.artists = source.artists || {};
                renderHome();
                initCloudSync();
            });
        };

        function renderHome() {
            document.getElementById('home-artists').innerHTML = Object.values(db.artists).map(a => `
                <div onclick="openArtistPage('${a.name}')" class="flex-shrink-0 w-24 text-center transform active:scale-90 transition-all cursor-pointer">
                    <div class="aspect-square w-full mb-3 rounded-full overflow-hidden border border-white/5 shadow-2xl bg-surface">
                        <img src="${imgBust(a.img)}" class="w-full h-full object-cover">
                    </div>
                    <div class="text-[10px] font-bold truncate uppercase text-white">${a.name}</div>
                </div>`).join('');
            
            const topTracks = [...db.tracks].reverse().slice(0, 12);
            document.getElementById('home-charts').innerHTML = groupTracks(topTracks).map(group => `
                <div class="track-column">${group.map(t => renderTrackItem(t)).join('')}</div>
            `).join('');
            lucide.createIcons();
        }

        function renderTrackItem(t) {
            if(!t) return '';
            const isFav = favorites.includes(t.id);
            return `<div class="flex items-center gap-4 p-2 rounded-xl active:bg-white/5 transition-all cursor-pointer" onclick="playTrack(${t.id})">
                <img src="${imgBust(t.img)}" class="w-12 h-12 rounded-lg object-cover bg-surface shadow-md">
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-sm truncate text-white">${t.title}</div>
                    <div class="text-[10px] text-dim uppercase truncate">${t.artist}</div>
                </div>
                <button class="p-2 shrink-0" onclick="event.stopPropagation(); toggleFavorite(${t.id})">
                    <i data-lucide="heart" class="w-5 h-5 ${isFav ? 'fill-heart text-heart' : 'text-dim/20'}"></i>
                </button>
            </div>`;
        }

        function groupTracks(tracks) {
            const groups = [];
            for (let i = 0; i < tracks.length; i += 3) groups.push(tracks.slice(i, i + 3));
            return groups;
        }

        function openArtistPage(name) {
            const artistKey = sanitize(name);
            const a = db.artists[artistKey]; if(!a) return;
            navTo('artist');
            document.getElementById('artist-view-img').src = imgBust(a.img);
            document.getElementById('artist-view-name').innerText = a.name;
            const aTracks = db.tracks.filter(t => sanitize(t.artist) === artistKey);
            document.getElementById('artist-view-tracks').innerHTML = aTracks.length ? aTracks.map(t => renderTrackItem(t)).join('') : '<div class="text-dim p-4">Нет треков</div>';
            
            document.getElementById('artist-view-albums').innerHTML = (a.albums || []).map(alb => `
                <div onclick="openAlbumPage('${a.name}', '${alb.title}')" class="album-card transform active:scale-95 transition-all cursor-pointer">
                    <img src="${imgBust(alb.cover)}">
                    <div class="mt-2 text-xs font-bold truncate px-1 text-white">${alb.title}</div>
                </div>`).join('');
            document.getElementById('btn-play-artist').onclick = () => { if(aTracks.length) playTrack(aTracks[0].id, aTracks); };
            lucide.createIcons();
        }

        function openAlbumPage(artistName, albumTitle) {
            const artistKey = sanitize(artistName);
            const a = db.artists[artistKey]; if(!a) return;
            const album = a.albums.find(x => x.title === albumTitle);
            const albumTracks = db.tracks.filter(t => sanitize(t.artist) === artistKey && t.album === albumTitle);
            navTo('album');
            document.getElementById('album-view-img').src = imgBust(album.cover);
            document.getElementById('album-view-title').innerText = albumTitle;
            document.getElementById('album-view-artist').innerText = artistName;
            document.getElementById('album-tracks-list').innerHTML = albumTracks.map(t => renderTrackItem(t)).join('');
            document.getElementById('btn-album-back').onclick = () => openArtistPage(artistName);
            document.getElementById('btn-play-album').onclick = () => { if(albumTracks.length) playTrack(albumTracks[0].id, albumTracks); };
            lucide.createIcons();
        }

        function playTrack(id, playlist = null) {
            const t = db.tracks.find(x => x.id === id); if(!t) return;
            currentTrackId = id; currentPlaylist = playlist || db.tracks;
            
            document.getElementById('m-title').innerText = t.title;
            document.getElementById('m-artist').innerText = t.artist;
            document.getElementById('m-img').src = imgBust(t.img);
            document.getElementById('f-title').innerText = t.title;
            document.getElementById('f-artist').innerText = t.artist;
            document.getElementById('f-img').src = imgBust(t.img);
            
            audio.src = t.url;
            audio.load(); // Принудительная загрузка
            audio.play().catch(() => console.log("Play blocked"));
            
            document.getElementById('mini-player').classList.remove('translate-y-[200px]');
            updatePlayIcons(true);
            updateHeartIcons();
        }

        function togglePlay() { 
            if(audio.paused) { audio.play(); updatePlayIcons(true); } 
            else { audio.pause(); updatePlayIcons(false); } 
        }

        function updatePlayIcons(playing) {
            const icon = playing ? 'pause' : 'play';
            document.getElementById('m-play-icon').setAttribute('data-lucide', icon);
            document.getElementById('f-play-icon').setAttribute('data-lucide', icon);
            lucide.createIcons();
        }

        function nextTrack() {
            if (!currentPlaylist.length) return;
            let i = currentPlaylist.findIndex(t => t.id === currentTrackId);
            let nextIdx = isShuffle ? Math.floor(Math.random() * currentPlaylist.length) : (i + 1) % currentPlaylist.length;
            playTrack(currentPlaylist[nextIdx].id, currentPlaylist);
        }

        function prevTrack() {
            if (!currentPlaylist.length) return;
            let i = currentPlaylist.findIndex(t => t.id === currentTrackId);
            let prevIdx = (i - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrack(currentPlaylist[prevIdx].id, currentPlaylist);
        }

        function playRandom() { if(db.tracks.length) { isShuffle = true; toggleShuffle(); nextTrack(); } }

        function seek(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const p = (e.clientX - rect.left) / rect.width;
            audio.currentTime = p * audio.duration;
        }

        audio.ontimeupdate = () => {
            if(audio.duration) {
                const p = (audio.currentTime / audio.duration) * 100;
                document.getElementById('f-progress').style.width = p + "%";
                document.getElementById('f-current-time').innerText = formatTime(audio.currentTime);
                document.getElementById('f-total-time').innerText = formatTime(audio.duration);
            }
        };

        audio.onloadedmetadata = () => {
            document.getElementById('f-total-time').innerText = formatTime(audio.duration);
        };

        audio.onended = () => isRepeat ? (audio.currentTime = 0, audio.play()) : nextTrack();

        function initCloudSync() {
            rtdb.ref('users/' + user.id + '/favorites').on('value', (snap) => {
                favorites = Object.keys(snap.val() || {}).filter(k => snap.val()[k] === true).map(Number);
                updateFavoritesUI();
            });
        }

        function updateFavoritesUI() {
            const favs = db.tracks.filter(t => favorites.includes(t.id));
            if(favs.length) {
                document.getElementById('fav-section').classList.remove('hidden');
                document.getElementById('favorites-list').innerHTML = groupTracks(favs.slice().reverse().slice(0, 12)).map(group => `
                    <div class="track-column">${group.map(t => renderTrackItem(t)).join('')}</div>
                `).join('');
            } else document.getElementById('fav-section').classList.add('hidden');
            updateHeartIcons();
            lucide.createIcons();
        }

        function toggleFavorite(id) { rtdb.ref('users/' + user.id + '/favorites/' + id).set(!favorites.includes(id)); }

        function updateHeartIcons() {
            const isFav = favorites.includes(currentTrackId);
            const btn = document.getElementById('f-heart');
            if (btn) {
                btn.classList.toggle('text-heart', isFav);
                btn.classList.toggle('fill-heart', isFav);
            }
            lucide.createIcons();
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('shuffle-btn');
            btn.classList.toggle('opacity-20', !isShuffle);
            btn.classList.toggle('text-brandY', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            const btn = document.getElementById('repeat-btn');
            btn.classList.toggle('opacity-20', !isRepeat);
            btn.classList.toggle('text-brandY', isRepeat);
        }

        function navTo(p) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            if(p === 'home') {
                document.getElementById('nav-home').classList.replace('text-dim/40', 'text-brandY');
                document.getElementById('nav-fav').classList.replace('text-brandY', 'text-dim/40');
            }
            document.getElementById('scroll-container').scrollTop = 0;
        }

        function openFullList(title, list) {
            navTo('full-list');
            document.getElementById('nav-fav').classList.replace('text-dim/40', 'text-brandY');
            document.getElementById('nav-home').classList.replace('text-brandY', 'text-dim/40');
            document.getElementById('full-list-content').innerHTML = `<h1 class="text-3xl font-black mb-8 text-white">${title}</h1><div class="space-y-1">${list.map(t => renderTrackItem(t)).join('')}</div>`;
            lucide.createIcons();
        }

        function handleSearch() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            if (!q) { navTo('home'); return; }
            navTo('search');
            const foundArtists = Object.values(db.artists).filter(a => a.name.toLowerCase().includes(q));
            const foundTracks = db.tracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
            let h = '';
            if(foundArtists.length) {
                h += `<div class="text-[10px] text-dim uppercase mb-4 px-2">Исполнители</div>`;
                foundArtists.forEach(a => h += `<div onclick="openArtistPage('${a.name}')" class="flex items-center gap-4 p-4 rounded-3xl bg-surface/40 mb-4 cursor-pointer"><img src="${imgBust(a.img)}" class="w-12 h-12 rounded-full object-cover"><div>${a.name}</div></div>`);
            }
            if(foundTracks.length) {
                h += `<div class="text-[10px] text-dim uppercase mb-4 px-2">Треки</div>`;
                h += foundTracks.map(t => renderTrackItem(t)).join('');
            }
            document.getElementById('search-results').innerHTML = h || '<div class="text-dim text-center py-20">Ничего не найдено</div>';
            lucide.createIcons();
        }

        function openFullPlayer() { document.getElementById('full-player').classList.remove('translate-y-full'); }
        function closeFullPlayer() { document.getElementById('full-player').classList.add('translate-y-full'); }
        function getFavorites() { return db.tracks.filter(t => favorites.includes(t.id)); }
    </script>
</body>
</html>
