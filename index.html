<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUS.LIB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { bg: '#0a0510', accent: '#8a2be2', surface: '#1a1225', text: '#ffffff', dim: '#b3a9c0', heart: '#ff2d55', brandY: '#ffcc00' } } } }
    </script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Manrope', sans-serif; overflow: hidden; }
        .app-container { background-color: #0a0510; width: 100%; max-width: 480px; margin: 0 auto; height: 100vh; position: relative; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-player { background: rgba(26, 18, 37, 0.98); backdrop-filter: blur(30px); border-top: 1px solid rgba(138, 43, 226, 0.2); }
        .h-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 10px 0; }
        .album-card { min-width: 140px; flex-shrink: 0; }
        .album-card img { width: 140px; height: 140px; border-radius: 1.5rem; object-fit: cover; }
        .track-column { min-width: 85vw; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
        .page { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="flex items-center justify-center sm:bg-zinc-950">
    <div class="app-container sm:border-x sm:border-white/10">
        <main id="scroll-container" class="absolute inset-0 overflow-y-auto no-scrollbar pb-40">
            <!-- Search & Header -->
            <div class="p-6 pt-10 sticky top-0 bg-bg/90 backdrop-blur-xl z-50 flex items-center gap-4">
                <div class="flex-1 flex items-center gap-3 bg-surface/50 border border-white/5 rounded-2xl px-5 py-3">
                    <i data-lucide="search" class="w-4 h-4 text-dim"></i>
                    <input id="search-input" type="text" placeholder="Поиск" class="bg-transparent outline-none w-full text-sm" oninput="handleSearch()">
                </div>
            </div>

            <!-- Home -->
            <section id="page-home" class="page p-4">
                <div onclick="playRandom()" class="h-40 rounded-[2rem] bg-gradient-to-br from-accent to-heart p-8 flex flex-col justify-end mb-8 cursor-pointer">
                    <h2 class="text-2xl font-black italic uppercase">Случайный микс</h2>
                </div>
                
                <div class="mb-8">
                    <h2 class="text-xl font-bold mb-4 px-2">Артисты</h2>
                    <div id="home-artists" class="h-scroll no-scrollbar px-2"></div>
                </div>

                <div class="mb-8">
                    <h2 class="text-xl font-bold mb-4 px-2">Новинки</h2>
                    <div id="home-charts" class="h-scroll no-scrollbar px-2"></div>
                </div>

                <div id="fav-section" class="hidden mb-8">
                    <h2 class="text-xl font-bold mb-4 px-2 text-heart">Любимое</h2>
                    <div id="favorites-list" class="h-scroll no-scrollbar px-2"></div>
                </div>
            </section>

            <!-- Artist View -->
            <section id="page-artist" class="page hidden">
                <div class="relative h-[40vh] w-full flex flex-col justify-end p-6">
                    <img id="artist-view-img" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-bg to-transparent"></div>
                    <button onclick="navTo('home')" class="absolute top-10 left-6 bg-black/40 p-3 rounded-full"><i data-lucide="chevron-left"></i></button>
                    <h1 id="artist-view-name" class="relative text-4xl font-black z-10"></h1>
                </div>
                <div class="p-4" id="artist-view-tracks"></div>
            </section>

            <section id="page-search" class="page hidden p-6"><div id="search-results" class="space-y-2"></div></section>
        </main>

        <!-- Player -->
        <div id="mini-player" onclick="openFullPlayer()" class="glass-player absolute bottom-24 left-2 right-2 rounded-3xl p-3 z-[100] translate-y-[200px] flex items-center gap-3 transition-transform">
            <img id="m-img" class="w-12 h-12 rounded-xl object-cover">
            <div class="flex-1 min-w-0"><div id="m-title" class="font-bold text-sm truncate">...</div><div id="m-artist" class="text-dim text-[10px] truncate uppercase">...</div></div>
            <button onclick="event.stopPropagation(); togglePlay()" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center"><i id="m-play-icon" data-lucide="play" class="fill-black w-5 h-5"></i></button>
        </div>

        <!-- Full Player -->
        <div id="full-player" class="absolute inset-0 bg-bg z-[200] translate-y-full transition-transform flex flex-col p-8">
            <button onclick="closeFullPlayer()" class="mb-8"><i data-lucide="chevron-down" class="w-8 h-8"></i></button>
            <div class="flex-1 flex items-center justify-center mb-8"><img id="f-img" class="w-full aspect-square rounded-[3rem] object-cover shadow-2xl"></div>
            <h2 id="f-title" class="text-2xl font-black mb-1">...</h2>
            <p id="f-artist" class="text-dim mb-8 uppercase">...</p>
            
            <div class="mb-8">
                <div class="h-1 bg-white/10 rounded-full cursor-pointer" onclick="seek(event)"><div id="f-progress" class="h-full bg-white rounded-full w-0"></div></div>
            </div>

            <div class="flex items-center justify-around">
                <button onclick="prevTrack()"><i data-lucide="skip-back" class="w-8 h-8"></i></button>
                <button onclick="togglePlay()" class="w-20 h-20 bg-white text-black rounded-full flex items-center justify-center"><i id="f-play-icon" data-lucide="play" class="fill-black w-10 h-10 ml-1"></i></button>
                <button onclick="nextTrack()"><i data-lucide="skip-forward" class="w-8 h-8"></i></button>
            </div>
        </div>

        <nav class="absolute bottom-0 left-0 right-0 h-20 bg-bg/80 backdrop-blur-md border-t border-white/5 flex items-center justify-around">
            <button onclick="navTo('home')" class="text-brandY flex flex-col items-center"><i data-lucide="home"></i><span class="text-[9px] font-bold">ГЛАВНАЯ</span></button>
            <button onclick="tg.showAlert('Скоро!')" class="text-dim/40 flex flex-col items-center"><i data-lucide="heart"></i><span class="text-[9px] font-bold">МОЁ</span></button>
        </nav>
        <audio id="audio-engine"></audio>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://project-48022103835443054-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const tg = window.Telegram.WebApp; tg.ready();
        const audio = document.getElementById('audio-engine');
        let db = { tracks: [], artists: {} }, currentPlaylist = [], currentTrackId = null;

        function sanitize(n) { return n ? n.toString().replace(/[.$#\[\]\/]/g, "").trim() : "unknown"; }
        function imgBust(u) { return u || 'https://via.placeholder.com/300'; }

        rtdb.ref('/').on('value', (snap) => {
            const data = snap.val() || {};
            const source = data.music_data || data;
            db.tracks = Array.isArray(source.tracks) ? source.tracks : Object.values(source.tracks || {});
            db.artists = source.artists || {};
            renderHome();
        });

        function renderHome() {
            const artHtml = Object.values(db.artists).map(a => `
                <div onclick="openArtistPage('${a.name}')" class="w-24 shrink-0 text-center cursor-pointer">
                    <div class="w-24 h-24 rounded-full overflow-hidden mb-2 bg-surface"><img src="${imgBust(a.img)}" class="w-full h-full object-cover"></div>
                    <div class="text-[10px] font-bold truncate uppercase">${a.name}</div>
                </div>`).join('');
            document.getElementById('home-artists').innerHTML = artHtml || '<p class="text-xs text-dim">Нет артистов</p>';

            const tracksHtml = groupTracks(db.tracks.slice().reverse().slice(0, 12));
            document.getElementById('home-charts').innerHTML = tracksHtml.map(group => `
                <div class="track-column">${group.map(t => renderTrackItem(t)).join('')}</div>`).join('') || '<p class="text-xs text-dim">Нет треков</p>';
            lucide.createIcons();
        }

        function renderTrackItem(t) {
            return `<div onclick="playTrack(${t.id})" class="flex items-center gap-4 p-2 active:bg-white/5 rounded-xl cursor-pointer">
                <img src="${imgBust(t.img)}" class="w-12 h-12 rounded-lg object-cover">
                <div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">${t.title}</div><div class="text-[10px] text-dim uppercase truncate">${t.artist}</div></div>
            </div>`;
        }

        function groupTracks(arr) { let g = []; for(let i=0; i<arr.length; i+=3) g.push(arr.slice(i, i+3)); return g; }

        function openArtistPage(name) {
            const a = db.artists[sanitize(name)]; if(!a) return;
            navTo('artist');
            document.getElementById('artist-view-img').src = imgBust(a.img);
            document.getElementById('artist-view-name').innerText = a.name;
            const aTracks = db.tracks.filter(t => sanitize(t.artist) === sanitize(name));
            document.getElementById('artist-view-tracks').innerHTML = aTracks.map(t => renderTrackItem(t)).join('');
            lucide.createIcons();
        }

        function playTrack(id) {
            const t = db.tracks.find(x => x.id === id); if(!t) return;
            currentTrackId = id; currentPlaylist = db.tracks;
            document.getElementById('m-title').innerText = document.getElementById('f-title').innerText = t.title;
            document.getElementById('m-artist').innerText = document.getElementById('f-artist').innerText = t.artist;
            document.getElementById('m-img').src = document.getElementById('f-img').src = imgBust(t.img);
            audio.src = t.url; audio.play();
            document.getElementById('mini-player').classList.remove('translate-y-[200px]');
            updateIcons(true);
        }

        function togglePlay() { audio.paused ? audio.play() : audio.pause(); updateIcons(!audio.paused); }
        function updateIcons(play) { const i = play ? 'pause' : 'play'; document.getElementById('m-play-icon').setAttribute('data-lucide', i); document.getElementById('f-play-icon').setAttribute('data-lucide', i); lucide.createIcons(); }
        
        audio.ontimeupdate = () => { if(audio.duration) document.getElementById('f-progress').style.width = (audio.currentTime/audio.duration)*100 + "%"; };
        audio.onended = () => nextTrack();

        function nextTrack() { let i = currentPlaylist.findIndex(x => x.id === currentTrackId); playTrack(currentPlaylist[(i+1)%currentPlaylist.length].id); }
        function prevTrack() { let i = currentPlaylist.findIndex(x => x.id === currentTrackId); playTrack(currentPlaylist[(i-1+currentPlaylist.length)%currentPlaylist.length].id); }
        function playRandom() { if(db.tracks.length) playTrack(db.tracks[Math.floor(Math.random()*db.tracks.length)].id); }

        function navTo(p) { document.querySelectorAll('.page').forEach(x => x.classList.add('hidden')); document.getElementById('page-'+p).classList.remove('hidden'); }
        function openFullPlayer() { document.getElementById('full-player').classList.remove('translate-y-full'); }
        function closeFullPlayer() { document.getElementById('full-player').classList.add('translate-y-full'); }
        function seek(e) { const p = e.offsetX / e.currentTarget.offsetWidth; if(audio.duration) audio.currentTime = p * audio.duration; }

        function handleSearch() {
            const q = document.getElementById('search-input').value.toLowerCase();
            if(!q) { navTo('home'); return; }
            navTo('search');
            const tracks = db.tracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
            document.getElementById('search-results').innerHTML = tracks.map(t => renderTrackItem(t)).join('') || '<p class="text-dim">Ничего не найдено</p>';
            lucide.createIcons();
        }
    </script>
</body>
</html>
