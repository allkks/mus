<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>MUS.LIB — Premium</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        bg: '#0a0510', accent: '#8a2be2', surface: '#1a1225', 
                        text: '#ffffff', dim: '#b3a9c0', heart: '#ff2d55', brandY: '#ffcc00' 
                    },
                    fontFamily: { sans: ['Manrope', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; color: #ffffff; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        .app-container { background-color: #0a0510; width: 100%; max-width: 480px; margin: 0 auto; height: 100vh; position: relative; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-player { background: rgba(26, 18, 37, 0.98); backdrop-filter: blur(30px); border-top: 1px solid rgba(138, 43, 226, 0.2); }
        .hero-bg { background: linear-gradient(180deg, transparent 0%, rgba(10, 5, 16, 1) 100%); }
        .yandex-gradient { background: linear-gradient(135deg, #8a2be2 0%, #ff2d55 100%); }
        .h-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding-bottom: 10px; }
        .track-column { min-width: 85vw; max-width: 380px; scroll-snap-align: start; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
        .album-card { min-width: 130px; scroll-snap-align: start; }
        .page { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="flex items-center justify-center sm:bg-zinc-950">

    <div class="app-container sm:border-x sm:border-white/10">
        <main id="scroll-container" class="absolute inset-0 overflow-y-auto no-scrollbar pb-40">
            
            <!-- HEADER -->
            <div class="p-6 pt-10 sticky top-0 bg-bg/90 backdrop-blur-xl z-50 flex items-center gap-4">
                <div class="flex-1 flex items-center gap-3 bg-surface/50 border border-white/5 rounded-2xl px-5 py-3 focus-within:border-accent transition-all">
                    <i data-lucide="search" class="w-4 h-4 text-dim"></i>
                    <input id="search-input" type="text" placeholder="Поиск музыки" class="bg-transparent outline-none w-full text-sm text-white" oninput="handleSearch()">
                </div>
                <div id="user-avatar" class="w-10 h-10 rounded-full bg-accent/20 flex items-center justify-center border border-accent/30 overflow-hidden text-accent shrink-0">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
            </div>

            <!-- HOME -->
            <section id="page-home" class="page p-4">
                <div onclick="playRandom()" class="relative h-52 rounded-[2.5rem] overflow-hidden mb-10 yandex-gradient shadow-2xl p-8 flex flex-col justify-end transform active:scale-95 transition-transform cursor-pointer">
                    <div class="absolute top-4 right-8 opacity-20"><i data-lucide="waves" class="w-32 h-32 text-white"></i></div>
                    <h2 class="text-4xl font-black italic tracking-tighter leading-none relative z-10">Случайный<br>трек</h2>
                    <div class="absolute bottom-8 right-8 w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-xl text-black z-10"><i data-lucide="play" class="fill-black ml-1"></i></div>
                </div>

                <div class="mb-10">
                    <h2 class="text-xl font-bold mb-4 px-2 flex items-center justify-between">
                        <span class="flex items-center gap-2"><i data-lucide="trending-up" class="w-5 h-5 text-brandY"></i>Мировой чарт</span>
                    </h2>
                    <div id="home-charts" class="h-scroll no-scrollbar px-2"></div>
                </div>

                <div id="fav-section" class="hidden mb-10">
                    <h2 onclick="openFullList('Мне нравится', getFavorites())" class="text-xl font-bold mb-4 px-2 flex items-center justify-between text-heart cursor-pointer">
                        <span>Мне нравится</span><i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </h2>
                    <div id="favorites-list" class="h-scroll no-scrollbar px-2"></div>
                </div>

                <div class="mb-10">
                    <h2 class="text-xl font-bold mb-4 px-2 flex items-center justify-between">
                        <span>Исполнители</span>
                    </h2>
                    <div id="home-artists" class="h-scroll no-scrollbar px-2"></div>
                </div>
            </section>

            <!-- PAGE: ARTIST -->
            <section id="page-artist" class="page hidden">
                <div class="relative h-[45vh] w-full flex flex-col justify-end overflow-hidden">
                    <img id="artist-view-img" class="absolute inset-0 w-full h-full object-cover shadow-2xl">
                    <div class="absolute inset-0 hero-bg"></div>
                    <button onclick="navTo('home')" class="absolute top-6 left-6 bg-black/40 p-3 rounded-full backdrop-blur-xl border border-white/10 z-10 text-white"><i data-lucide="chevron-left"></i></button>
                    <div class="relative p-6 pb-8 z-10">
                        <h1 id="artist-view-name" class="text-5xl font-black italic tracking-tighter mb-4 text-white leading-tight"></h1>
                        <button class="bg-brandY text-black px-12 py-4 rounded-full font-black shadow-xl" id="btn-play-artist">СЛУШАТЬ</button>
                    </div>
                </div>
                <div class="p-4 mt-4">
                    <h2 class="text-xl font-bold mb-4 text-white">Треки</h2>
                    <div id="artist-view-tracks" class="space-y-1"></div>
                    <h2 class="text-xl font-bold mb-4 mt-8">Альбомы</h2>
                    <div id="artist-view-albums" class="h-scroll no-scrollbar"></div>
                </div>
            </section>

            <!-- PAGE: ALBUM -->
            <section id="page-album" class="page hidden">
                <div class="relative h-[40vh] w-full flex flex-col justify-end overflow-hidden text-center">
                    <img id="album-view-img" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 hero-bg"></div>
                    <button id="btn-album-back" class="absolute top-6 left-6 bg-black/40 p-3 rounded-full backdrop-blur-xl border border-white/10 z-10"><i data-lucide="chevron-left" class="text-white"></i></button>
                    <div class="relative p-6 pb-8 z-10">
                        <h1 id="album-view-title" class="text-3xl font-black text-white mb-1"></h1>
                        <p id="album-view-artist" class="text-dim mb-4"></p>
                        <button class="bg-white text-black px-10 py-3 rounded-full font-bold shadow-xl" id="btn-play-album">СЛУШАТЬ ВСЁ</button>
                    </div>
                </div>
                <div class="p-4 space-y-1" id="album-tracks-list"></div>
            </section>

            <!-- PAGE: FULL LIST -->
            <section id="page-full-list" class="page hidden p-6">
                <button onclick="navTo('home')" class="flex items-center gap-2 text-dim mb-6"><i data-lucide="chevron-left"></i> Назад</button>
                <div id="full-list-content"></div>
            </section>

            <section id="page-search" class="page hidden p-6 text-white"><div id="search-results" class="space-y-2"></div></section>
        </main>

        <!-- MINI PLAYER -->
        <div id="mini-player" onclick="openFullPlayer()" class="glass-player absolute bottom-24 left-2 right-2 rounded-3xl p-3 z-[100] transition-all duration-500 translate-y-[200px] shadow-2xl flex items-center gap-3 cursor-pointer">
            <img id="m-img" class="w-12 h-12 rounded-xl object-cover shrink-0" src="">
            <div class="flex-1 min-w-0">
                <div id="m-title" class="font-bold text-sm truncate text-white">...</div>
                <div id="m-artist" class="text-dim text-[10px] uppercase truncate">...</div>
            </div>
            <button onclick="event.stopPropagation(); togglePlay()" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-all shrink-0">
                <i id="m-play-icon" data-lucide="play" class="fill-black w-5 h-5 ml-0.5"></i>
            </button>
        </div>

        <!-- FULL PLAYER -->
        <div id="full-player" class="absolute inset-0 bg-bg z-[200] transition-transform duration-500 translate-y-full flex flex-col p-8 pb-12 overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-6 shrink-0"><button onclick="closeFullPlayer()"><i data-lucide="chevron-down" class="w-8 h-8 text-white"></i></button><span class="text-[10px] font-bold uppercase tracking-widest opacity-30 text-white">Плеер</span><button><i data-lucide="more-horizontal" class="w-6 h-6 text-white"></i></button></div>
            <div class="flex-1 flex items-center justify-center mb-8 min-h-[30vh]"><img id="f-img" class="w-full aspect-square max-w-[280px] rounded-[3rem] object-cover shadow-2xl border border-white/5"></div>
            <div class="flex items-center justify-between mb-6 shrink-0">
                <div class="flex-1 min-w-0 pr-4 text-white"><h2 id="f-title" class="text-3xl font-black italic mb-1 truncate leading-tight">...</h2><p id="f-artist" class="text-lg text-dim truncate">...</p></div>
                <button onclick="toggleFavorite(currentTrackId)" class="p-2 text-white shrink-0"><i id="f-heart" data-lucide="heart" class="w-8 h-8"></i></button>
            </div>
            <div class="mb-8 shrink-0">
                <div class="relative h-1.5 bg-white/10 rounded-full mb-3 cursor-pointer" id="seek-bar" onclick="seek(event)">
                    <div id="f-progress" class="absolute top-0 left-0 h-full bg-white rounded-full"></div>
                    <div id="f-handle" class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-lg" style="left: 0%"></div>
                </div>
                <div class="flex justify-between text-[11px] font-mono text-dim"><span id="f-current-time">0:00</span><span id="f-total-time">0:00</span></div>
            </div>
            <div class="flex items-center justify-around mb-4 shrink-0">
                <button id="shuffle-btn" onclick="toggleShuffle()" class="p-2 active:scale-90 opacity-20 transition-all text-white"><i data-lucide="shuffle" class="w-6 h-6"></i></button>
                <button onclick="prevTrack()" class="p-2 active:scale-75 transition-all text-white"><i data-lucide="skip-back" class="w-10 h-10 fill-white"></i></button>
                <button onclick="togglePlay()" class="w-20 h-20 bg-white text-black rounded-full flex items-center justify-center shadow-xl active:scale-95 transition-all shrink-0"><i id="f-play-icon" data-lucide="play" class="fill-black w-10 h-10 ml-1"></i></button>
                <button onclick="nextTrack()" class="p-2 active:scale-75 transition-all text-white"><i data-lucide="skip-forward" class="w-10 h-10 fill-white"></i></button>
                <button id="repeat-btn" onclick="toggleRepeat()" class="p-2 active:scale-90 opacity-20 transition-all text-white"><i data-lucide="repeat" class="w-6 h-6"></i></button>
            </div>
        </div>

        <!-- NAVBAR -->
        <div class="absolute bottom-0 left-0 right-0 h-20 bg-bg/80 backdrop-blur-md border-t border-white/5 flex items-center justify-around z-[90] pb-safe">
            <button id="nav-home" onclick="navTo('home')" class="nav-btn flex flex-col items-center gap-1 text-brandY"><i data-lucide="home"></i><span class="text-[10px] font-bold">ГЛАВНАЯ</span></button>
            <button id="nav-fav" onclick="openFullList('Мне нравится', getFavorites())" class="nav-btn flex flex-col items-center gap-1 text-dim/40"><i data-lucide="heart"></i><span class="text-[10px] font-bold">МОЁ</span></button>
        </div>

        <audio id="audio-engine"></audio>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDRxdwpKhy4hn-umuwKLrYfCZ4caafAV_o",
            authDomain: "project-48022103835443054.firebaseapp.com",
            databaseURL: "https://project-48022103835443054-default-rtdb.firebaseio.com",
            projectId: "project-48022103835443054",
            storageBucket: "project-48022103835443054.firebasestorage.app",
            messagingSenderId: "812358314577",
            appId: "1:812358314577:web:a392af88486face13aa670"
        };
        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.ready();
        const user = tg.initDataUnsafe?.user || { id: "guest", first_name: "Слушатель" };

        let db = { tracks: [], artists: {} };
        let favorites = [];
        let currentTrackId = null;
        let currentPlaylist = [];
        let isShuffle = false;
        let isRepeat = false;
        let globalBust = Date.now();
        const audio = document.getElementById('audio-engine');

        function sanitize(n) { return n ? n.replace(/[.$#\[\]\/]/g, "").strip : ""; }

        window.onload = () => {
            lucide.createIcons();
            if (user.photo_url) document.getElementById('user-avatar').innerHTML = `<img src="${user.photo_url}" class="w-full h-full object-cover">`;

            rtdb.ref('/').on('value', (snap) => {
                const data = snap.val() || {};
                const source = data.music_data || data;
                
                // Преобразуем объект треков в массив, если нужно
                let rawTracks = source.tracks || [];
                db.tracks = Array.isArray(rawTracks) ? rawTracks : Object.values(rawTracks);
                db.artists = source.artists || {};
                
                renderHome();
                initCloudSync();
            });
        };

        function renderHome() {
            const artistsCont = document.getElementById('home-artists');
            const chartsCont = document.getElementById('home-charts');
            
            // Рендер артистов
            artistsCont.innerHTML = Object.values(db.artists).map(a => `
                <div onclick="openArtistPage('${a.name}')" class="flex-shrink-0 w-24 text-center transform active:scale-90 transition-transform cursor-pointer">
                    <div class="aspect-square w-full mb-3 rounded-full overflow-hidden border border-white/5 shadow-2xl bg-surface">
                        <img src="${imgBust(a.img)}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="text-[10px] font-bold truncate text-white uppercase tracking-wider">${a.name}</div>
                </div>`).join('');

            // Рендер чарта (топ 12)
            const topTracks = db.tracks.slice(0, 12);
            chartsCont.innerHTML = groupTracks(topTracks).map(group => `
                <div class="track-column">${group.map((t, i) => renderTrackItem(t)).join('')}</div>
            `).join('');

            updateFavoritesUI();
            lucide.createIcons();
        }

        function renderTrackItem(t) {
            const isFav = favorites.includes(t.id);
            return `
                <div class="flex items-center gap-4 p-2 rounded-xl active:bg-white/5 transition-all cursor-pointer text-white" onclick="playTrack(${t.id})">
                    <img src="${imgBust(t.img)}" class="w-12 h-12 rounded-lg object-cover bg-surface">
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-sm truncate">${t.title}</div>
                        <div class="text-[10px] text-dim uppercase truncate">${t.artist}</div>
                    </div>
                    <button class="p-2" onclick="event.stopPropagation(); toggleFavorite(${t.id})">
                        <i data-lucide="heart" class="w-5 h-5 ${isFav ? 'fill-heart text-heart' : 'text-dim/20'}"></i>
                    </button>
                </div>`;
        }

        function groupTracks(tracks) {
            const groups = [];
            for (let i = 0; i < tracks.length; i += 3) groups.push(tracks.slice(i, i + 3));
            return groups;
        }

        function openArtistPage(name) {
            // Ищем артиста по имени в объекте
            const artistKey = Object.keys(db.artists).find(key => db.artists[key].name === name);
            const a = db.artists[artistKey];
            if(!a) return;

            navTo('artist');
            document.getElementById('artist-view-img').src = imgBust(a.img);
            document.getElementById('artist-view-name').innerText = a.name;
            
            const aTracks = db.tracks.filter(t => t.artist === name);
            document.getElementById('artist-view-tracks').innerHTML = aTracks.map(t => renderTrackItem(t)).join('');
            
            const albums = a.albums || [];
            document.getElementById('artist-view-albums').innerHTML = albums.map(alb => `
                <div onclick="openAlbumPage('${name}', '${alb.title}')" class="album-card transform active:scale-95 transition-all cursor-pointer text-white flex-shrink-0">
                    <img src="${imgBust(alb.cover)}" class="w-full aspect-square rounded-2xl object-cover mb-2 shadow-xl border border-white/5 bg-surface">
                    <div class="text-xs font-bold truncate">${alb.title}</div>
                    <div class="text-[10px] text-dim">${alb.year || '2026'}</div>
                </div>`).join('');

            document.getElementById('btn-play-artist').onclick = () => { if(aTracks.length) playTrack(aTracks[0].id, aTracks); };
            lucide.createIcons();
        }

        function openAlbumPage(artistName, albumTitle) {
            const artistKey = Object.keys(db.artists).find(key => db.artists[key].name === artistName);
            const a = db.artists[artistKey];
            const album = a.albums.find(x => x.title === albumTitle);
            const albumTracks = db.tracks.filter(t => t.artist === artistName && t.album === albumTitle);
            
            navTo('album');
            document.getElementById('album-view-img').src = imgBust(album.cover);
            document.getElementById('album-view-title').innerText = albumTitle;
            document.getElementById('album-view-artist').innerText = artistName;
            document.getElementById('album-tracks-list').innerHTML = albumTracks.map(t => renderTrackItem(t)).join('');
            
            document.getElementById('btn-album-back').onclick = () => openArtistPage(artistName);
            document.getElementById('btn-play-album').onclick = () => { if(albumTracks.length) playTrack(albumTracks[0].id, albumTracks); };
            lucide.createIcons();
        }

        function playTrack(id, playlist = null) {
            const t = db.tracks.find(x => x.id === id);
            if(!t) return;
            
            currentTrackId = id;
            currentPlaylist = playlist || db.tracks;
            
            document.getElementById('m-title').innerText = t.title;
            document.getElementById('m-artist').innerText = t.artist;
            document.getElementById('m-img').src = imgBust(t.img);
            document.getElementById('f-title').innerText = t.title;
            document.getElementById('f-artist').innerText = t.artist;
            document.getElementById('f-img').src = imgBust(t.img);
            
            audio.src = t.url;
            audio.play().catch(e => console.log("Play failed"));
            
            document.getElementById('mini-player').classList.remove('translate-y-[200px]');
            updatePlayIcons(true);
            updateHeartIcons();
        }

        function togglePlay() { 
            if(audio.paused) { audio.play(); updatePlayIcons(true); }
            else { audio.pause(); updatePlayIcons(false); }
        }

        function updatePlayIcons(playing) {
            const icon = playing ? 'pause' : 'play';
            document.querySelectorAll('[data-lucide="play"], [data-lucide="pause"]').forEach(el => {
                el.setAttribute('data-lucide', icon);
            });
            lucide.createIcons();
        }

        function nextTrack() {
            if (!currentPlaylist.length) return;
            let i = currentPlaylist.findIndex(t => t.id === currentTrackId);
            let nextIdx;
            if (isShuffle) {
                do { nextIdx = Math.floor(Math.random() * currentPlaylist.length); } 
                while (currentPlaylist.length > 1 && nextIdx === i);
            } else {
                nextIdx = (i + 1) % currentPlaylist.length;
            }
            playTrack(currentPlaylist[nextIdx].id, currentPlaylist);
        }

        function prevTrack() {
            if (!currentPlaylist.length) return;
            let i = currentPlaylist.findIndex(t => t.id === currentTrackId);
            let prevIdx = (i - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrack(currentPlaylist[prevIdx].id, currentPlaylist);
        }

        function playRandom() {
            if(!db.tracks.length) return;
            isShuffle = true;
            document.getElementById('shuffle-btn').classList.replace('opacity-20', 'text-brandY');
            nextTrack();
        }

        function seek(e) {
            const rect = document.getElementById('seek-bar').getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        }

        audio.ontimeupdate = () => { 
            if(audio.duration) {
                const p = (audio.currentTime/audio.duration)*100;
                document.getElementById('f-progress').style.width = p + "%";
                document.getElementById('f-handle').style.left = p + "%";
                document.getElementById('f-current-time').innerText = formatTime(audio.currentTime);
                document.getElementById('f-total-time').innerText = formatTime(audio.duration);
            }
        };
        audio.onended = () => isRepeat ? (audio.currentTime = 0, audio.play()) : nextTrack();

        function initCloudSync() {
            rtdb.ref('users/' + user.id + '/favorites').on('value', (snap) => {
                const data = snap.val() || {};
                favorites = Object.keys(data).filter(k => data[k] === true).map(Number);
                updateFavoritesUI();
            });
        }

        function updateFavoritesUI() {
            const favs = getFavorites();
            const section = document.getElementById('fav-section');
            if(favs.length > 0) {
                section.classList.remove('hidden');
                document.getElementById('favorites-list').innerHTML = groupTracks(favs.slice(0, 12)).map(group => `
                    <div class="track-column">${group.map(t => renderTrackItem(t)).join('')}</div>
                `).join('');
            } else section.classList.add('hidden');
            updateHeartIcons();
            lucide.createIcons();
        }

        function toggleFavorite(id) {
            const isFav = favorites.includes(id);
            rtdb.ref('users/' + user.id + '/favorites/' + id).set(!isFav);
        }

        function updateHeartIcons() {
            const isFav = favorites.includes(currentTrackId);
            const btn = document.getElementById('f-heart');
            if (btn) {
                btn.classList.toggle('fill-heart', isFav);
                btn.classList.toggle('text-heart', isFav);
                btn.classList.toggle('text-white', !isFav);
            }
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffle-btn').classList.toggle('opacity-20', !isShuffle);
            document.getElementById('shuffle-btn').classList.toggle('text-brandY', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeat-btn').classList.toggle('opacity-20', !isRepeat);
            document.getElementById('repeat-btn').classList.toggle('text-brandY', isRepeat);
        }

        function navTo(p) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            document.getElementById('scroll-container').scrollTop = 0;
            if(p === 'home') document.getElementById('search-input').value = '';
        }

        function handleSearch() {
            const q = document.getElementById('search-input').value.toLowerCase().trim();
            if (!q) { navTo('home'); return; }
            navTo('search');
            const foundArtists = Object.values(db.artists).filter(a => a.name.toLowerCase().includes(q));
            const foundTracks = db.tracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
            let h = '';
            if(foundArtists.length) {
                h += `<div class="text-[10px] text-dim uppercase mb-4 tracking-widest px-2">Исполнители</div>`;
                foundArtists.forEach(a => h += `<div onclick="openArtistPage('${a.name}')" class="flex items-center gap-4 p-4 rounded-3xl bg-surface/40 mb-4 cursor-pointer"><img src="${imgBust(a.img)}" class="w-12 h-12 rounded-full object-cover bg-surface"><div>${a.name}</div></div>`);
            }
            if(foundTracks.length) {
                h += `<div class="text-[10px] text-dim uppercase mb-4 tracking-widest px-2">Треки</div>`;
                h += foundTracks.map(t => renderTrackItem(t)).join('');
            }
            document.getElementById('search-results').innerHTML = h || '<div class="text-dim text-center py-20">Ничего не найдено</div>';
            lucide.createIcons();
        }

        function openFullPlayer() { document.getElementById('full-player').classList.remove('translate-y-full'); }
        function closeFullPlayer() { document.getElementById('full-player').classList.add('translate-y-full'); }
        function formatTime(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
        function imgBust(u) { return u ? `${u}?v=${globalBust}` : ''; }
        function getFavorites() { return db.tracks.filter(t => favorites.includes(t.id)); }
    </script>
</body>
</html>
